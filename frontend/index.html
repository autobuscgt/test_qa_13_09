<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автомобили — CRUD</title>
</head>
<style>
    *{
        font-family: Arial, Helvetica, sans-serif;
    }
    :root{
        --main-color:rgba(0, 0, 0, 0.87);
        --second-color:rgba(0, 0, 0, 0.67);
        background-color: rgb(238, 236, 236);
        --third-color:rgba(0, 0, 0, 0.54);
    }
    #cars{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
    .car-card__price{
        color: var(--main-color);
    }
    .car-card__year{
        color: var(--third-color);
    }
    .car-card__id{
        color: var(--third-color);
    }
    .car-card__body{
        background-color: rgba(255, 255, 255, 1);
        box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
    }
    img{
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    .btn-update{
        border: 0px;
        height:100%;
        background-color: rgb(252, 92, 92);
        cursor: pointer;
    }
    .btn-delete{
        border: 0px;
        height:35px;
        background-color: rgb(255, 205, 112);
        cursor:crosshair;
    }
    .car-card__actions{
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
    }
</style>
<body>
    <h2>Добавить автомобиль</h2>
    <form class="car-form" id="carForm">
        <input type="number" name="year"  placeholder="Год"  required>
        <input type="number" name="price" placeholder="Цена" required>
        <input type="file"   name="image" accept="image/*" required>
        <button type="submit">Добавить</button>
    </form>
    <!-- <img src="${STATIC_URL}/${image}" alt="Car ${id}" loading="lazy">
    <div class="car-card__body">
        <p class="car-card__price">${Number(price).toLocaleString('ru-RU')} ₽</p>
        <p class="car-card__year">${year} год</p>
        <p class="car-card__id">ID: ${id}</p>
        <div class="car-card__actions">
            <button class="btn-update" data-id="${id}">Обновить</button>
            <button class="btn-delete" data-id="${id}">Удалить</button>
        </div>
    </div> -->
    <h2>Список автомобилей</h2>
    <div id="cars"></div>

    <script>
        const API_URL    = 'http://localhost:7000/api/cars';
        const STATIC_URL = 'http://localhost:7000'; // префикс статики — проверьте под свой express.static

        const container = document.querySelector('#cars');
        const form      = document.querySelector('#carForm');

        // ---------- GET ----------
        async function getCars() {
            const response = await fetch(API_URL);
            // намеренно выводим код в confirm, как вы просили
            // confirm(`GET ${API_URL} → статус: ${response.status}`);
            // if (!response.ok) throw new Error('Ошибка загрузки');
            return response.json();
        }

        // ---------- POST ----------
        async function createCar(formData) {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: formData           // Content-Type ставить НЕ надо, браузер сам выставит multipart/form-data с boundary
            });
            confirm(`POST ${API_URL} → статус: ${response.status}`);
            return response;
        }

        // ---------- PUT ----------
        async function updateCar(id, body) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            confirm(`PUT ${API_URL}/${id} → статус: ${response.status}`);
            return response;
        }

        // ---------- DELETE ----------
        async function deleteCar(id) {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            confirm(`DELETE ${API_URL}/${id} → статус: ${response.status}`);
            return response;
        }

        // ---------- Рендер ----------
        function createCarCard({ id, image, price, year }) {
            const card = document.createElement('div');
            card.className = 'car-card';
            card.innerHTML = `
            <div class="car-card__body">
                <img src="${STATIC_URL}/${image}" alt="Car ${id}" loading="lazy">
                    <p class="car-card__price">${Number(price).toLocaleString('ru-RU')} ₽</p>
                    <p class="car-card__year">${year} год</p>
                    <p class="car-card__id">ID: ${id}</p>
                    <div class="car-card__actions">
                        <button class="btn-update" data-id="${id}">Обновить</button>
                        <button class="btn-delete" data-id="${id}">Удалить</button>
                    </div>
                </div>
            `;
            return card;
        }

        function renderCars({ cars }) {
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();
            cars.forEach(car => fragment.appendChild(createCarCard(car)));
            container.appendChild(fragment);
        }

        async function refresh() {
            try {
                const data = await getCars();
                renderCars(data);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        // ---------- Обработчики ----------
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            try {
                const response = await createCar(formData);
                if (response.ok) {
                    form.reset();
                    await refresh();
                } else {
                    confirm(`Не удалось добавить. Код: ${response.status}`);
                }
            } catch (err) {
                console.error(err);
            }
        });

        container.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = btn.dataset.id;

            if (btn.classList.contains('btn-delete')) {
                if (!confirm(`Удалить машину с ID ${id}?`)) return;
                try {
                    await deleteCar(id);
                    await refresh();
                } catch (err) { console.error(err); }
            }

            if (btn.classList.contains('btn-update')) {
                const year  = prompt('Новый год:', '');
                const price = prompt('Новая цена:', '');
                if (!year || !price) return;
                try {
                    await updateCar(id, { year, price });
                    await refresh();
                } catch (err) { console.error(err); }
            }
        });

        refresh();
    </script>
</body>
</html>
